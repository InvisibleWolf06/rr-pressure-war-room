:root{--pink:#EC008C;--blue:#254AA5;--navy:#0B1E4A;--grey:#6B7385;--line:#E3E6EE;--soft:#F6F7FB}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#1d2433;background:#fff;font-size:14px}
.wrap{max-width:1240px;margin:0 auto;padding:18px}
.hero{background:linear-gradient(110deg,var(--navy) 0%,var(--blue) 60%,var(--pink) 100%);color:#fff;padding:22px 26px;border-radius:16px}
.hero h1{margin:0;font-size:26px}.hero p{margin:6px 0 0;opacity:.9;line-height:1.45}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:16px 0 14px}
.tab{background:none;border:0;padding:10px 14px;font:inherit;cursor:pointer;color:#444;border-bottom:3px solid transparent}
.tab.on{color:var(--pink);border-bottom-color:var(--pink);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:6px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{color:var(--grey);font-size:12px}.kpi .v{font-size:24px;font-weight:700;color:var(--navy)}.kpi .s{font-size:12px;color:#1c7a45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card h4{margin:0 0 4px;display:flex;align-items:center;gap:8px;font-size:16px}
.rank{display:inline-block;min-width:28px;height:28px;line-height:28px;text-align:center;border-radius:8px;background:var(--pink);color:#fff;font-weight:700}
.prr{margin-left:auto;font-size:20px;font-weight:700;color:var(--navy)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;margin:2px 4px 2px 0;background:#EEF1F8;color:var(--navy)}
.chip.rr{background:var(--pink);color:#fff}.chip.warn{background:#FFF4D6;color:#7A5600}
.muted{color:var(--grey);font-size:12.5px;line-height:1.5}
.moment{border-left:5px solid var(--pink);background:#FAFBFE;padding:10px 14px;border-radius:8px;margin-bottom:8px;line-height:1.55}
.moment.bad{border-left-color:#9aa1b2}
h2{color:var(--navy);font-size:19px;margin:18px 0 8px}h3{color:var(--navy);font-size:16px;margin:14px 0 6px}
select,input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:240px;max-width:100%}
.ctrl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
.seg button{font:inherit;border:1px solid var(--line);background:#fff;padding:6px 14px;cursor:pointer}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.note{background:#EEF3FF;border-radius:10px;padding:10px 14px;margin:10px 0;line-height:1.5}
.warnbox{background:#FFF7E0;border-radius:10px;padding:10px 14px;margin:10px 0;line-height:1.5}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--navy);color:#fff;text-align:left;padding:6px 8px;position:sticky;top:0}
td{padding:5px 8px;border-bottom:1px solid var(--line)}tr:nth-child(even) td{background:var(--soft)}
.tbl{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.plot{width:100%}
ul{margin:4px 0 8px 18px;padding:0;line-height:1.55}
.method p{line-height:1.6;margin:6px 0}
/* ===== stadium mode ===== */
html{scroll-behavior:smooth}
body{background:#050B24;color:#1d2433}
#bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block}
#dim{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,rgba(5,11,36,.0) 0%,rgba(5,11,36,.55) 100%);opacity:0;transition:opacity .2s linear}
#progress{position:fixed;top:0;left:0;height:4px;width:0;z-index:30;background:linear-gradient(90deg,#FFD54A,#EC008C,#ffffff);box-shadow:0 0 12px #EC008C}
.intro{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:3.5vh;text-align:center;color:#fff;pointer-events:none}
.intro .low{position:absolute;left:50%;transform:translateX(-50%);top:66vh;width:min(780px,92vw)}
.intro .low p{background:rgba(5,11,36,.55);backdrop-filter:blur(6px);border-radius:14px;padding:12px 18px;margin:0 auto}
.intro .kicker{letter-spacing:.42em;font-size:12px;font-weight:600;color:#FFD54A;text-transform:uppercase;opacity:0;animation:fadeUp 1.2s .2s forwards}
.intro h1{margin:.25em 0 .2em;font-size:clamp(30px,5.2vw,68px);line-height:1.02;font-weight:800;letter-spacing:-.01em;

.cue{position:absolute;bottom:5vh;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;letter-spacing:.3em;opacity:.85;text-transform:uppercase}
.cue span{display:block;margin:8px auto 0;width:22px;height:36px;border:2px solid #fff;border-radius:14px;position:relative}
.cue span::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#E4007C;animation:wheel 1.6s infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}

.wrap{position:relative;z-index:2}
.stage{background:rgba(255,255,255,.93);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px);border-radius:22px;

/* ===== broadcast theme ===== */
:root{--ink:#EEF0F7;--ink2:rgba(238,240,247,.66);--ink3:rgba(238,240,247,.42);--edge:rgba(255,255,255,.10);--glass:rgba(255,255,255,.045);--gold:#F4C542;--pink:#EC008C;--hot:#FF3FA9}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.intro h1,.intro .kicker,.cue{font-family:'Barlow Condensed',sans-serif}
.intro h1{font-weight:800;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(40px,6.6vw,92px);line-height:.92}
.intro .kicker{letter-spacing:.5em;font-size:13px;font-weight:600}
.stage{background:linear-gradient(165deg,rgba(28,12,52,.80) 0%,rgba(74,6,58,.72) 46%,rgba(14,26,72,.82) 100%);
  backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
  border:1px solid rgba(255,255,255,.12);box-shadow:0 40px 120px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);padding:0 0 30px;overflow:hidden}
.stage::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--pink),var(--gold) 55%,#5B7FE0)}
#view{padding:0 26px}
/* navigation */
.tabs{position:sticky;top:0;z-index:20;margin:0 0 6px;padding:0 18px;gap:0;border:0;border-bottom:1px solid var(--edge);border-radius:0;box-shadow:none;
  background:linear-gradient(180deg,rgba(18,8,34,.96),rgba(30,10,46,.90));backdrop-filter:blur(14px)}
.tab{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:16px 16px 13px;border-bottom:3px solid transparent}
.tab .n{font-size:11px;color:var(--ink3);margin-right:7px;letter-spacing:.05em}
.tab:hover{color:var(--ink)}
.tab.on{color:#fff;border-bottom-color:var(--pink);font-weight:700}.tab.on .n{color:var(--gold)}
/* section header band */
.sec{position:relative;margin:0 -26px 22px;padding:30px 26px 22px;border-bottom:1px solid var(--edge);
  background:radial-gradient(120% 140% at 0% 0%,rgba(236,0,140,.22),rgba(236,0,140,0) 55%),linear-gradient(90deg,rgba(255,255,255,.035),rgba(255,255,255,0))}
.sec .eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px}
.sec .eyebrow b{display:inline-block;padding:2px 8px;border:1px solid rgba(244,197,66,.55);border-radius:3px;letter-spacing:.08em;font-weight:700}
.sec h1{margin:6px 0 4px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(34px,4.2vw,54px);line-height:.95;letter-spacing:.01em;text-transform:uppercase;color:#fff}
.sec h1 em{font-style:normal;color:var(--hot)}
.sec p{margin:6px 0 0;max-width:820px;color:var(--ink2);line-height:1.55;font-size:14.5px}
.sec::after{content:"";position:absolute;left:26px;bottom:-1px;width:120px;height:3px;background:linear-gradient(90deg,var(--pink),var(--gold))}
/* sub-headers */
h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:21px;letter-spacing:.06em;text-transform:uppercase;color:#fff;margin:26px 0 12px;
  padding:2px 0 2px 12px;border-left:4px solid var(--pink);line-height:1.15}
h3{font-family:'Barlow Condensed',sans-serif;color:#fff;text-transform:uppercase;letter-spacing:.05em}
b,strong{color:#fff;font-weight:600}
.muted{color:var(--ink2)}
/* KPI tiles */
.kpis{gap:0;border:1px solid var(--edge);border-radius:10px;overflow:hidden;background:var(--glass)}
.kpi{background:transparent;border:0;border-right:1px solid var(--edge);border-radius:0;padding:16px 18px}
.kpi:last-child{border-right:0}
.kpi .l{color:var(--ink3);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.kpi .v{font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:700;color:#fff;line-height:1.05;margin-top:4px}
.kpi .s{color:var(--gold);font-size:12px}
/* player cards */
.card{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--edge);border-radius:10px;padding:14px 16px}

.prr{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;color:#fff}
.prr::after{content:" PRR";font-size:12px;letter-spacing:.14em;color:var(--ink3);font-weight:600}
.card.gold{background:linear-gradient(135deg,rgba(60,14,58,.96),rgba(30,16,60,.96)) padding-box,linear-gradient(120deg,var(--gold),var(--pink),#fff,var(--gold)) border-box;border:1.5px solid transparent;background-size:100% 100%,300% 300%}

.chip.rr{background:var(--pink);color:#fff;border-color:var(--pink)}.chip.warn{background:rgba(244,197,66,.14);color:var(--gold);border-color:rgba(244,197,66,.4)}
/* evidence blocks */
.moment{background:rgba(255,255,255,.04);border:1px solid var(--edge);border-left:4px solid var(--pink);border-radius:8px;color:var(--ink2)}
.moment b{color:#fff}.moment.bad{border-left-color:#8C93A8}
.note{background:rgba(91,127,224,.12);border:1px solid rgba(91,127,224,.35);color:var(--ink);border-radius:8px}
.warnbox{background:rgba(244,197,66,.10);border:1px solid rgba(244,197,66,.35);color:var(--ink);border-radius:8px}
ul{color:var(--ink2)}li b{color:#fff}
.method p{color:var(--ink2)}
/* controls */
select,input{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:6px}
select option{background:#1d0f30;color:#fff}
input::placeholder{color:var(--ink3)}
.seg button{background:transparent;color:var(--ink2);border:1px solid rgba(255,255,255,.18);font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.seg button.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.ctrl>b,.ctrl>.muted{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:14px}
/* charts and tables */
.plot{background:rgba(255,255,255,.03);border:1px solid var(--edge);border-radius:10px;padding:4px}
.tbl{border:1px solid var(--edge);border-radius:10px;background:rgba(10,4,24,.35)}
table{font-size:13px;color:var(--ink)}
th{background:rgba(30,10,48,.97);color:var(--gold);font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:9px 10px;border-bottom:2px solid var(--pink)}
td{border-bottom:1px solid rgba(255,255,255,.06);padding:7px 10px;white-space:nowrap}
th{white-space:nowrap}
tr:nth-child(even) td{background:rgba(255,255,255,.025)}
tr:hover td{background:rgba(236,0,140,.10)}
.go{font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:linear-gradient(135deg,#EC008C,#B8006C);color:#fff;border:0;border-radius:6px;padding:8px 18px;cursor:pointer;box-shadow:0 6px 18px rgba(236,0,140,.35)}
.two>div{min-width:0}.tbl{overflow-x:auto}
.go.sm{font-size:12px;padding:5px 12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:1000px){.grid3{grid-template-columns:1fr 1fr}}@media(max-width:640px){.grid3{grid-template-columns:1fr}}
.lk{cursor:pointer;border-bottom:1px dotted rgba(255,255,255,.35)}.lk:hover{color:var(--hot)}
.eyebrow b{color:var(--hot)}
.go:disabled{opacity:.45;cursor:default}.go:hover:not(:disabled){filter:brightness(1.12)}
.chip.av{background:rgba(74,222,128,.12);color:#8EF0B0;border-color:rgba(74,222,128,.4)}.chip.ru{background:rgba(244,197,66,.14);color:var(--gold);border-color:rgba(244,197,66,.4)}.chip.no{background:rgba(255,255,255,.05);color:var(--ink3)}
.st-available{color:#8EF0B0}.st-rumoured{color:var(--gold)}.st-contracted,.st-rr,.st-retired,.st-ineligible{color:var(--ink3)}

    if (running && !reduce) requestAnimationFrame(frame);
  }
  function onScroll(){
    scrollF = scrollY / innerHeight;

    const max = document.documentElement.scrollHeight - innerHeight;
    document.getElementById('progress').style.width = (max > 0 ? scrollY / max * 100 : 0) + '%';
    if (reduce) frame(performance.now());

  addEventListener('scroll', onScroll, {passive: true});

const io = ('IntersectionObserver' in window) ? new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting){ e.target.classList.add('in'); countUp(e.target); io.unobserve(e.target); }
}), {threshold: .12, rootMargin: '0px 0px -6% 0px'}) : null;
function countUp(el){
  el.querySelectorAll('[data-count]').forEach(n => {
    if (n.dataset.done) return; n.dataset.done = 1;
    const end = parseFloat(n.dataset.count), dec = +(n.dataset.dec || 0), t0 = performance.now(), dur = 1400;
    const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      n.textContent = (end * e).toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec}); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function armReveals(){
  const els = document.querySelectorAll('#view .card, #view .kpi, #view .moment, #view h2, #view .plot, #view .tbl, #view .note, #view .warnbox, #view .two > div > p, #view .ctrl');
  const counts = new Map();
  els.forEach(el => {
    const parent = el.parentElement, i = counts.get(parent) || 0; counts.set(parent, i + 1);
    el.classList.add('reveal'); el.style.transitionDelay = Math.min(i, 8) * 70 + 'ms';
    if (io) io.observe(el); else { el.classList.add('in'); countUp(el); }
  });
  document.querySelectorAll('#view .card').forEach(c => { if (c.querySelector('.rank') && c.querySelector('.rank').textContent.trim() === '1') c.classList.add('gold'); });
}

function fitBat(c){ const s = c.splits, o = [];
  if (['Middle order','Finisher'].includes(c.role)) o.push("Plugs RR's biggest leak: Nos. 5–7 under pressure.");
  if (c.role === 'Top order') o.push("No. 3–4 option: RR's top order sits below league average under pressure.");
  if (s.death[2] >= 30 && s.death[0] > s.death[1]) o.push(`Death-overs pressure SR ${s.death[0]} vs ${s.death[1]} expected.`);
  if (s.vs_spin[2] >= 30 && s.vs_spin[0] > s.vs_spin[1]) o.push(`Beats spin under pressure: SR ${s.vs_spin[0]} vs ${s.vs_spin[1]} expected.`);
  if (c.in_rr) o.push('Already an RR player: the case for building around him.');
  if (!c.ipl_seasons) o.push('IPL-untested: pressure record comes from T20Is, so price in the risk of adjusting to IPL conditions.');
  return o.length ? o : ['Pressure-proof top-order option.']; }
function fitBowl(c){ const s = c.splits, o = [];
  if (String(c.phase_role).includes('Death') && s.death[2] >= 30 && s.death[0] < s.death[1]) o.push(`Fixes RR's death-overs leak: pressure economy at the death ${s.death[0]} vs ${s.death[1]} expected.`);
  if (c.kind !== 'Pace' && s.death[2] >= 18 && s.death[0] < s.death[1]) o.push(`A spinner who can bowl at the death (${s.death[0]} vs ${s.death[1]} expected); RR's death spin is −0.32 vs league.`);
  if (c.kind !== 'Pace') o.push("Adds to RR's middle-overs spin, already a strength, to squeeze the chase.");
  if (String(c.phase_role).includes('New ball')) o.push('Can take the new ball too: flexibility in the Impact Player era.');
  if (c.in_rr) o.push('Already an RR player.');
  return o; }
function rr(){
  const cl = RR.close;
  let h = `<h2>Where RR lose under pressure</h2><div class="two"><div id="rrT" class="plot"></div><div id="rrS" class="plot"></div></div><div id="rrB" class="plot"></div>
    <div class="warnbox">RR won only <b>${cl.won} of ${cl.n}</b> close IPL games in 2025–26 (decided by ≤15 runs or ≤3 wickets). The leaks: Nos. 5–7 and the tail in run chases, death-overs batting, and death-overs bowling (both pace and spin).</div>
    <h2>How each auction-board pick strengthens RR</h2><div class="two"><div>`;
  D.bat_board.forEach(c => h += `<p><b>${c.rank}. ${esc(c.name)}</b> (${esc(c.role)})<br>${fitBat(c).map(x => '• ' + esc(x)).join('<br>')}</p>`);
  h += `</div><div>`;
  D.bowl_board.forEach(c => h += `<p><b>${c.rank}. ${esc(c.name)}</b> (${esc(c.role)})<br>${fitBowl(c).map(x => '• ' + esc(x)).join('<br>')}</p>`);
  h += `</div></div>`;
  setTimeout(() => {
    const tt = RR.team_table.slice().sort((a,b) => a.bat - b.bat);
    Plotly.newPlot('rrT', [{type:'bar', orientation:'h', y:tt.map(t => t.team), x:tt.map(t => t.bat), marker:{color:tt.map(t => t.team==='Rajasthan Royals'?PINK:GREY)}, text:tt.map(t => t.bat.toFixed(2)), textposition:'outside', cliponaxis:false, hovertemplate:'%{y}: %{x:.2f}<extra></extra>'}],
      LAY({height:360, title:{text:'Batting: win % gained per 100 pressure balls', font:{size:15, family:'Barlow Condensed', color:'#ffffff'}}, margin:{l:170,r:40,t:44,b:30}, xaxis:{range:[-0.85, 0.55], gridcolor:'rgba(255,255,255,.08)', zerolinecolor:'rgba(255,255,255,.25)'}}), PCFG);
    const sl = RR.bat_slot;
    Plotly.newPlot('rrS', [{type:'bar', x:sl.map(r => r.role_slot), y:sl.map(r => r.gap), marker:{color:sl.map(r => r.gap<0?PINK:BLUE)}, text:sl.map(r => `${r.gap>0?'+':''}${r.gap} (n=${r.n})`), textposition:'outside', cliponaxis:false, hovertemplate:'%{x}: %{y:.2f}<extra></extra>'}],
      LAY({height:360, title:{text:'RR batting vs league, by slot', font:{size:15, family:'Barlow Condensed', color:'#ffffff'}}, yaxis:{range:[-1.0,1.0], gridcolor:'rgba(255,255,255,.08)', title:'Gap, win % / 100 pressure balls'}}), PCFG);
    const ph = RR.bowl_phase_type;
    Plotly.newPlot('rrB', [{type:'bar', x:ph.map(r => r.phase + ' · ' + r.btype), y:ph.map(r => r.gap), marker:{color:ph.map(r => r.gap<0?PINK:BLUE)}, text:ph.map(r => `${r.gap>0?'+':''}${r.gap} (n=${r.n})`), textposition:'outside', cliponaxis:false, hovertemplate:'%{x}: %{y:.2f}<extra></extra>'}],
      LAY({height:320, title:{text:'RR bowling vs league, by phase and type', font:{size:15, family:'Barlow Condensed', color:'#ffffff'}}, yaxis:{range:[-0.85,0.5], gridcolor:'rgba(255,255,255,.08)'}}), PCFG);
  });
  return h;
}

function method(){
  let h = `<div class="method"><h2>01 · Pressure is leverage, not overs</h2>
  <p>A <b>pitch-adjusted win-probability model</b> values every ball. <i>Chase:</i> runs needed vs expected remaining runs for the balls and wickets left on that pitch. <i>Batting first:</i> projected total vs the venue-season par. <b>Leverage</b> for a ball is the expected win-probability swing across everything that could happen (dot, 1, 2, 4, 6, wicket, extra), divided by the innings average so a normal ball scores 1. Pressure index = leverage × 1.2 after three or more dots in a row × 1.2 if a wicket fell in the last six balls. <b>The top 20% of balls are pressure balls.</b> Close finishes contain 84% more of them than other games, and 43% of death-over balls carry below-average leverage (usually dead games).</p>
  <h2>02 · Flat-wicket correction</h2><p>Every expectation uses the match's <b>scoring environment</b>: a shrunk venue effect plus the competition-season run rate. IPL rose from 8.5 to 9.8 runs per over in 2022–26, so 40 off 25 in 2026 is worth less than in 2022, and a bowler going at 8.5 in 2026 is having a good day.</p>
  <h2>03 · The rating (PRR)</h2><p>For each process skill (runs, dismissals and dots for batters; runs, wickets and dots for bowlers) I measure <b>actual minus expected</b> on every ball, where expected means the same innings, ball, wickets, required rate, pace or spin, and pitch. Pressure estimate = the player's (shrunk) all-situation skill + his pressure difference × n/(n+200). Then add <b>moments won</b> and <b>rise vs own baseline</b>. Opponents are weighted (associates 0.5, Ireland/Zimbabwe 0.8, A-teams 0.75), as is recency (0.55 in 2022 → 1.0 in 2026); knockouts count × 1.25.</p>
  <div class="tbl" style="max-height:none"><table><tr><th>Component</th><th>Batting weight</th><th>Bowling weight</th></tr>
  <tr><td>Runs vs expected</td><td>30%</td><td>25%</td></tr><tr><td>Dismissals / wickets</td><td>20%</td><td>20%</td></tr><tr><td>Dots</td><td>25%</td><td>30%</td></tr><tr><td>Moments won</td><td>15%</td><td>15%</td></tr><tr><td>Rise vs own baseline</td><td>10%</td><td>10%</td></tr></table></div>
  <div class="two" style="margin-top:12px"><div id="env" class="plot"></div><div id="rel" class="plot"></div></div>
  <h2>04 · Limits</h2><ul>
  <li>Pressure performance is <b>noisy</b>. Between a player's odd- and even-numbered matches the rating repeats at ${V.bat.split_half_prr.toFixed(2)} (batting) and ${V.bowl.split_half_prr.toFixed(2)} (bowling), against ${V.bat.split_half_naive.toFixed(2)} and ${V.bowl.split_half_naive.toFixed(2)} for a raw clutch score. Rising above your own usual level does not repeat at all, so the rating mostly rewards holding a high level under pressure. Every rank carries an 80% band from 300 match-level bootstrap resamples.</li>
  <li>An earlier version reported odd-even figures of 0.35 and 0.26; a bug let the two halves overlap. Rankings were unaffected.</li>
  <li>First-innings win probability is less certain (AUC 0.70 vs 0.90 for chases) because the target is unknown.</li>
  <li>No line, length, shot direction or edge data, so "decision vs execution" is built from stroke and delivery labels only.</li>
  <li>The ranking includes everyone, as the brief asks. The RR auction board leaves out players RR cannot buy: Pakistani nationals (Sufiyan Muqeem is #3 among bowlers), IPL retirees, Harry Brook (serving a two-season IPL ban), RR's own players, and anyone under contract elsewhere until the 17 November retention lists say otherwise.</li>
  <li>DLS-shortened and no-result games are excluded; super overs are not scored.</li></ul></div>`;
  setTimeout(() => {
    const env = D.env;
    Plotly.newPlot('env', [true, false].map(ipl => { const e = env.filter(r => r.ipl === ipl);
      return {x:e.map(r => r.yr), y:e.map(r => r.actual), mode:'lines+markers+text', text:e.map(r => r.actual.toFixed(2)), textposition:'top center', name: ipl ? 'IPL' : 'T20I', line:{color: ipl ? PINK : BLUE, width:2}}; }),
      LAY({height:320, title:{text:'Flat-wicket factor: runs per over by season', font:{size:15, family:'Barlow Condensed', color:'#ffffff'}}, yaxis:{range:[7.8,10.4], title:'Runs per over', gridcolor:'rgba(255,255,255,.08)'}, xaxis:{dtick:1, gridcolor:'rgba(255,255,255,.08)'}}), PCFG);
    const cats = ['Batting · odd/even', 'Batting · 22–24→25–26', 'Bowling · odd/even', 'Bowling · 22–24→25–26'];
    const nv = [V.bat.split_half_naive, V.bat.temporal_naive, V.bowl.split_half_naive, V.bowl.temporal_naive], pv = [V.bat.split_half_prr, V.bat.temporal_prr, V.bowl.split_half_prr, V.bowl.temporal_prr];
    Plotly.newPlot('rel', [{type:'bar', x:cats, y:nv, name:'Naive clutch score', marker:{color:GREY}, text:nv.map(v => v.toFixed(2)), textposition:'outside'},
      {type:'bar', x:cats, y:pv, name:'PRR', marker:{color:PINK}, text:pv.map(v => v.toFixed(2)), textposition:'outside'}],
      LAY({barmode:'group', height:320, title:{text:'Does the score repeat? (correlation)', font:{size:15, family:'Barlow Condensed', color:'#ffffff'}}, yaxis:{range:[-0.05,0.42], gridcolor:'rgba(255,255,255,.08)'}}), PCFG);
  });
  return h;
}

function board(){
  const rows = st.tDisc==='bat' ? D.bat_table : D.bowl_table;
  const roles = ['All', ...Array.from(new Set(rows.map(r => r.role))).sort()];
  let t = rows.filter(r => (st.tRole==='All' || r.role===st.tRole) && (st.tNat==='All' || (st.tNat==='Indian' ? r.nat==='India' : r.nat!=='India')) && (!st.tQ || r.name.toLowerCase().includes(st.tQ.toLowerCase())) && (st.tAv==='All' || (st.tAv==='RR can buy' ? (r.avail==='available'||r.avail==='rumoured') : AVAIL_L[r.avail]===st.tAv)));
  const bat = st.tDisc==='bat';
  let h = `<div class="ctrl">${seg('tDisc', st.tDisc)}<select id="tRole">${roles.map(r => `<option ${r===st.tRole?'selected':''}>${esc(r)}</option>`).join('')}</select>
    <select id="tNat">${['All','Indian','Overseas'].map(r => `<option ${r===st.tNat?'selected':''}>${r}</option>`).join('')}</select><select id="tAv">${['All','RR can buy',...Object.values(AVAIL_L)].map(r => `<option ${r===st.tAv?'selected':''}>${r}</option>`).join('')}</select><input id="tQ" placeholder="Search name" value="${esc(st.tQ)}"></div>
    <div class="tbl"><table><tr><th>Rank</th><th>Player</th><th>Role</th><th>Nation</th><th>IPL 2026</th><th>PRR</th><th>80% band</th><th>P(top 10)</th><th>Pressure balls</th>
    ${bat ? '<th>SR (exp)</th><th>Dot% (exp)</th><th>Avg</th>' : '<th>Econ (exp)</th><th>Dot% (exp)</th><th>Balls/wkt</th>'}<th>Top 10</th><th>RR board</th><th>Auction status</th></tr>`;
  t.forEach(r => { h += `<tr><td>${r.rank}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.role)}</td><td>${esc(r.nat)}</td><td>${esc(r.ipl_team)}</td><td>${f1(r.prr)}</td><td>${r.lo}–${r.hi}</td><td>${Math.round(r.p10)}%</td><td>${r.balls}</td>
    ${bat ? `<td>${f1(r.sr)} (${f1(r.xsr)})</td><td>${f1(r.dot)} (${f1(r.xdot)})</td><td>${f1(r.avg)}</td>` : `<td>${r.econ} (${r.xecon})</td><td>${f1(r.dot)} (${f1(r.xdot)})</td><td>${f1(r.bpw)}</td>`}<td>${r.selected ? '✓' : ''}</td><td>${r.board ? '✓' : ''}</td><td class="st-${r.avail}">${AVAIL_L[r.avail]}</td></tr>`; });
  h += `</table></div><div class="muted" style="margin-top:6px">${t.length} players. Figures are on pressure balls; "exp" is what the same situations on the same pitches normally produce.</div>`;
  setTimeout(() => {
    document.getElementById('tRole').onchange = e => { st.tRole = e.target.value; render(); };
    document.getElementById('tNat').onchange = e => { st.tNat = e.target.value; render(); };
    document.getElementById('tAv').onchange = e => { st.tAv = e.target.value; render(); };
    const q = document.getElementById('tQ'); q.oninput = e => { st.tQ = e.target.value; render(); const n = document.getElementById('tQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  });
  return h;
}

function render(){
  renderTabs();
  const fn = {war, moments, lab, rr, scout, retain, sim, method, board}[cur];
  const sx = SECT[cur], ix = TABS.findIndex(t => t[0]===cur) + 1;
  document.getElementById('view').innerHTML = `<header class="sec"><div class="eyebrow"><b>${String(ix).padStart(2,"0")}</b>${sx[0]}</div><h1>${sx[1]}</h1><p>${sx[2]}</p></header>` + fn();
  armReveals();
  document.querySelectorAll('[data-seg]').forEach(b => b.onclick = () => {
    const k = b.dataset.seg; st[k] = b.dataset.v;
    if (k==='mDisc') st.mPick = null; if (k==='lDisc') { st.l1 = null; st.l2 = ''; } if (k==='tDisc') st.tRole = 'All';
    render(); });
}
