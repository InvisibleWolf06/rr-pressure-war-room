<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RR Pressure War Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--pink:#EC008C;--blue:#254AA5;--navy:#0B1E4A;--grey:#6B7385;--line:#E3E6EE;--soft:#F6F7FB}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#1d2433;background:#fff;font-size:14px}
.wrap{max-width:1240px;margin:0 auto;padding:18px}
.hero{background:linear-gradient(110deg,var(--navy) 0%,var(--blue) 60%,var(--pink) 100%);color:#fff;padding:22px 26px;border-radius:16px}
.hero h1{margin:0;font-size:26px}.hero p{margin:6px 0 0;opacity:.9;line-height:1.45}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:16px 0 14px}
.tab{background:none;border:0;padding:10px 14px;font:inherit;cursor:pointer;color:#444;border-bottom:3px solid transparent}
.tab.on{color:var(--pink);border-bottom-color:var(--pink);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:6px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{color:var(--grey);font-size:12px}.kpi .v{font-size:24px;font-weight:700;color:var(--navy)}.kpi .s{font-size:12px;color:#1c7a45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card h4{margin:0 0 4px;display:flex;align-items:center;gap:8px;font-size:16px}
.rank{display:inline-block;min-width:28px;height:28px;line-height:28px;text-align:center;border-radius:8px;background:var(--pink);color:#fff;font-weight:700}
.prr{margin-left:auto;font-size:20px;font-weight:700;color:var(--navy)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;margin:2px 4px 2px 0;background:#EEF1F8;color:var(--navy)}
.chip.rr{background:var(--pink);color:#fff}.chip.warn{background:#FFF4D6;color:#7A5600}
.muted{color:var(--grey);font-size:12.5px;line-height:1.5}
.moment{border-left:5px solid var(--pink);background:#FAFBFE;padding:10px 14px;border-radius:8px;margin-bottom:8px;line-height:1.55}
.moment.bad{border-left-color:#9aa1b2}
h2{color:var(--navy);font-size:19px;margin:18px 0 8px}h3{color:var(--navy);font-size:16px;margin:14px 0 6px}
select,input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:240px;max-width:100%}
.ctrl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
.seg button{font:inherit;border:1px solid var(--line);background:#fff;padding:6px 14px;cursor:pointer}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.note{background:#EEF3FF;border-radius:10px;padding:10px 14px;margin:10px 0;line-height:1.5}
.warnbox{background:#FFF7E0;border-radius:10px;padding:10px 14px;margin:10px 0;line-height:1.5}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--navy);color:#fff;text-align:left;padding:6px 8px;position:sticky;top:0}
td{padding:5px 8px;border-bottom:1px solid var(--line)}tr:nth-child(even) td{background:var(--soft)}
.tbl{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.plot{width:100%}
ul{margin:4px 0 8px 18px;padding:0;line-height:1.55}
.method p{line-height:1.6;margin:6px 0}
/* ===== stadium mode ===== */
html{scroll-behavior:smooth}
body{background:#050B24;color:#1d2433}
#bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block}
#dim{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,rgba(5,11,36,.0) 0%,rgba(5,11,36,.55) 100%);opacity:0;transition:opacity .2s linear}
#progress{position:fixed;top:0;left:0;height:4px;width:0;z-index:30;background:linear-gradient(90deg,#FFD54A,#EC008C,#ffffff);box-shadow:0 0 12px #EC008C}
.intro{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:3.5vh;text-align:center;color:#fff;pointer-events:none}
.intro .low{position:absolute;left:50%;transform:translateX(-50%);top:66vh;width:min(780px,92vw)}
.intro .low p{background:rgba(5,11,36,.55);backdrop-filter:blur(6px);border-radius:14px;padding:12px 18px;margin:0 auto}
.intro .kicker{letter-spacing:.42em;font-size:12px;font-weight:600;color:#FFD54A;text-transform:uppercase;opacity:0;animation:fadeUp 1.2s .2s forwards}
.intro h1{margin:.25em 0 .2em;font-size:clamp(30px,5.2vw,68px);line-height:1.02;font-weight:800;letter-spacing:-.01em;
  background:linear-gradient(100deg,#fff 0%,#FFC2E3 40%,#fff 60%,#FFE38A 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 30px rgba(236,0,140,.7));opacity:0;animation:fadeUp 1.2s .45s forwards, shine 6s 1.6s linear infinite}
.intro p{max-width:760px;font-size:clamp(14px,1.6vw,18px);line-height:1.55;color:#E7ECFF;opacity:0;animation:fadeUp 1.2s .8s forwards;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.cue{position:absolute;bottom:5vh;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;letter-spacing:.3em;opacity:.85;text-transform:uppercase}
.cue span{display:block;margin:8px auto 0;width:22px;height:36px;border:2px solid #fff;border-radius:14px;position:relative}
.cue span::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#E4007C;animation:wheel 1.6s infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:-250% 0}}
.wrap{position:relative;z-index:2}
.stage{background:rgba(255,255,255,.93);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px);border-radius:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.4) inset;padding:18px 22px 26px;margin-bottom:60px}
.tabs{position:sticky;top:8px;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-radius:14px;padding:0 8px;margin:0 0 14px;box-shadow:0 8px 24px rgba(11,30,74,.12)}
.hero{display:none}
.reveal{opacity:0;transform:translateY(46px) scale(.97) perspective(900px) rotateX(9deg);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
.card{background:#fff;transition:transform .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(228,0,124,.16)}
.card.gold{position:relative;border:0;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(120deg,#FFD54A,#EC008C,#ffffff,#FFD54A) border-box;border:2px solid transparent;background-size:100% 100%,300% 300%;animation:goldflow 5s linear infinite}
@keyframes goldflow{to{background-position:0 0,300% 0}}
.card.gold .rank{background:linear-gradient(135deg,#F2B705,#E4007C);box-shadow:0 0 14px rgba(242,183,5,.8)}
.kpi{background:#fff}
.plot{background:#fff;border-radius:12px}
@media (prefers-reduced-motion: reduce){.reveal{opacity:1;transform:none;transition:none}.intro h1,.intro p,.intro .kicker{animation:none;opacity:1}.card.gold{animation:none}}

</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="dim"></div>
<div id="progress"></div>
<section class="intro">
  <div class="kicker">SupeRR Selector · Season 2 · Round 1</div>
  <h1>Pressure Reliability<br>War Room</h1>
  <div class="low"><p>Who delivers when the game is on the line, measured ball by ball, judged moment by moment, adjusted for flat IPL pitches, and built into a <b>varied</b> auction board for Rajasthan Royals.</p></div>
  <div class="cue">Scroll to enter<span></span></div>
</section>
<div class="wrap"><div class="stage">
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div></div>
<script id="data" type="application/json">__DATA__</script>
<script id="worms" type="application/json">__WORMS__</script>

(function(){

   <rect x="76" y="144" width="48" height="6" rx="3" fill="#fff"/>

  const crest = new Image(); crest.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(crestSVG);

  const K = innerWidth < 800 ? 2 : 3;
  const scene = document.createElement('canvas'); scene.width = IW * K; scene.height = IH * K;

    for (let x = 316; x < 386; x += 7){ c.beginPath(); c.moveTo(x, 98); c.lineTo(x + 7, 126); c.moveTo(x + 7, 98); c.lineTo(x, 126); c.stroke(); }
    c.fillStyle = '#ffe9b8'; for (let x = 320; x < 384; x += 6) c.fillRect(x, 112, 3, 1.6);
    c.fillStyle = '#35264f'; [322, 350, 380].forEach(x => c.fillRect(x, 126, 2, 26));
    [326, 343, 360, 377].forEach((x, i) => { c.strokeStyle = '#cfc6e6'; c.lineWidth = .7; c.beginPath(); c.moveTo(x, 98); c.lineTo(x, 84); c.stroke(); c.fillStyle = i % 2 ? '#ffffff' : '#ec008c'; c.beginPath(); c.moveTo(x, 84); c.lineTo(x + 8, 86); c.lineTo(x, 88.5); c.fill(); });
    tower(150, 136, 22, 300, 8.5); tower(222, 136, 22, 300, 8.5); tower(470, 136, 22, 300, 8.5); tower(532, 136, 22, 300, 8.5);
    tower(300, 118, 34, 300, 12); tower(402, 118, 34, 300, 12);
    tower(66, 124, 64, 345, 25);
    c.fillStyle = '#fff5fa'; c.beginPath(); c.arc(66, 236, 7, 0, 6.29); c.fill(); c.strokeStyle = '#c0508c'; c.lineWidth = 1.2; c.stroke(); c.lineWidth = .8; c.beginPath(); c.moveTo(66, 236); c.lineTo(66, 231.5); c.moveTo(66, 236); c.lineTo(69.5, 237); c.stroke();
    // ---- floodlight towers

      c.save(); c.translate(x, y); c.rotate(-.06); c.fillStyle = '#2b2440'; c.fillRect(-w / 2, -h / 2, w, h);
      c.shadowColor = '#fff'; c.shadowBlur = 5; c.fillStyle = '#fffdf2'; const nx = 7, ny = 4;
      for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) c.fillRect(-w / 2 + 1.5 + i * (w - 3) / nx, -h / 2 + 1.5 + j * (h - 3) / ny, (w - 3) / nx - 1, (h - 3) / ny - 1);

}

function chips(c, kind){
  let h = `<span class="chip">${esc(c.role)}</span><span class="chip">${esc(c.nationality)}</span>`;
  if (kind==='bat') h += `<span class="chip">${esc(c.hand)}</span>`;
  h += c.ipl_seasons ? `<span class="chip">IPL: ${esc(c.ipl_team)}</span>` : `<span class="chip warn">IPL-untested</span>`;
  if (c.in_rr) h += `<span class="chip rr">Already RR</span>`;
  return h;
}
function headline(c, kind){
  const p = c.pressure, m = c.moment_stats;
  return kind==='bat'
   ? `Under pressure: <b>SR ${p.sr}</b> vs ${p.xsr} expected · avg ${p.avg} · dots ${p.dot}% vs ${p.xdot}% · ${m.won}/${m.n} pressure moments won`
   : `Under pressure: <b>econ ${p.econ}</b> vs ${p.xecon} expected · balls/wkt ${p.bpw} · dots ${p.dot}% vs ${p.xdot}% · ${m.won}/${m.n} pressure overs won`;
}

      <div class="muted" style="margin-top:6px">${headline(c, kind)}</div><div class="muted">${band(c)}</div></div>`;

function cardsFor(kd){ const cs = Object.values(kd==='bat' ? D.bat_cards : D.bowl_cards); cs.sort((a,b) => a.raw_rank - b.raw_rank); return cs; }

function moments(){
  const cs = cardsFor(st.mDisc), top = new Set(D[st.mDisc+'_top'].map(c => c.id));
  if (!st.mPick || !cs.find(c => c.id === st.mPick)) { st.mPick = D[st.mDisc+'_top'][0].id; st.mMom = 0; }
  const c = cs.find(x => x.id === st.mPick);
  const all = c.moments.map(m => ['Signature', m]).concat(c.blemish.map(m => ['Blemish', m]));
  let h = `<p class="muted" style="font-size:14px">Every rating here is backed by <b>real match situations</b>. Pick a player to replay the moments that define him, and the one that went wrong. The line is his team's win probability after every ball; pink dots are the balls he faced or bowled.</p>
   <div class="ctrl">${seg('mDisc', st.mDisc)}<select id="mPick">${cs.map(x => `<option value="${x.id}" ${x.id===st.mPick?'selected':''}>${top.has(x.id)?'★ ':''}${esc(x.name)} (model #${x.raw_rank})</option>`).join('')}</select></div>
   <h2 style="margin-top:4px">${esc(c.name)} · PRR ${f1(c.prr)}</h2>${chips(c, st.mDisc)}<div class="muted" style="margin:6px 0 10px">${headline(c, st.mDisc)}</div>`;
  all.forEach(([t, m], i) => {
    h += `<div class="moment ${t==='Blemish'?'bad':''}"><b>${t}</b> · ${esc(m.date)} · ${esc(m.comp)} vs ${esc(m.opp)}${m.ko?' · <b>KNOCKOUT</b>':''}<br>
      <b>Walked into:</b> ${esc(m.situation)}<br><b>Did:</b> ${esc(m.did)}<br>
      <b>Win probability:</b> ${esc(m.wp)} · credited swing <b>${m.wpa>0?'+':''}${m.wpa.toFixed(1)} pts</b> · ${esc(m.result)}</div>`;
  });
  h += `<div class="ctrl"><b>Replay a moment</b><select id="mMom">${all.map(([t,m],i) => `<option value="${i}" ${i===st.mMom?'selected':''}>${t}: ${esc(m.date)} vs ${esc(m.opp)}</option>`).join('')}</select></div>
    <div id="worm" class="plot"></div><div class="muted">Credited swing adds up the win-probability change on every ball he faced (or bowled) from the moment pressure began. It can exceed the start-to-finish change when team-mates lost ground at the other end.</div>`;
  setTimeout(() => {
    document.getElementById('mPick').onchange = e => { st.mPick = +e.target.value; st.mMom = 0; render(); };
    document.getElementById('mMom').onchange = e => { st.mMom = +e.target.value; render(); };
    const [t, m] = all[Math.min(st.mMom, all.length-1)];
    const w = W[String(m.match_id)]; if (!w) return;
    const kd = st.mDisc;
    const mine = []; w.striker.forEach((s, i) => { if ((kd==='bat' ? s : w.bowler[i]) === c.id) mine.push(i); });
    const innP = mine.length ? w.inn[mine[0]] : 1;
    const first = kd==='bat' ? innP===1 : innP===2;
    const y = w.p1.map(v => (first ? v : 1 - v) * 100);
    const mt = /^(.+?) \d+\/\d+/.exec(m.situation);
    const team = kd==='bat' ? (mt ? mt[1] : 'His team') : `His team (bowling vs ${m.opp})`;
    Plotly.newPlot('worm', [
      {x:w.x, y, mode:'lines', line:{color:BLUE, width:2}, name:`${team} win %`, text:w.label, hovertemplate:'%{text}<br>Win %{y:.0f}%<extra></extra>'},
      {x:mine.map(i => w.x[i]), y:mine.map(i => y[i]), mode:'markers', marker:{color:PINK, size:8, line:{color:'#fff', width:1}}, name: kd==='bat'?'Balls he faced':'Balls he bowled', text:mine.map(i => w.label[i]), hovertemplate:'%{text}<br>Win %{y:.0f}%<extra></extra>'}
    ], LAY({height:340, title:{text:esc(m.result), font:{size:13}}, yaxis:{range:[0,100], title:`${team} win %`, gridcolor:'#EEF0F5'}, xaxis:{title:'Overs (0–20 first innings · 20–40 second innings)', gridcolor:'#EEF0F5'},
      shapes:[{type:'line', x0:20, x1:20, y0:0, y1:100, line:{dash:'dot', color:'#999', width:1}}, {type:'line', x0:0, x1:40, y0:50, y1:50, line:{color:'#E3E6EE', width:1}}]}), PCFG);
  });
  return h;
}

const COMP = {b_runs:'Runs above expected', b_out:'Dismissal avoidance', b_dot:'Dot avoidance', w_runs:'Runs saved', w_wkt:'Wickets above expected', w_dot:'Dot-ball creation', moment:'Moments won', delta:'Rise vs own baseline'};
function lab(){

  if (!st.l1 || !cs.find(c => c.id === st.l1)) { st.l1 = cs[0].id; st.l2 = ''; }

    sel.forEach((c, i) => {

      const act = bat ? [c.pressure.sr, s.vs_spin[0], s.death[0], s.ipl[0]] : [c.pressure.econ, s.death[0], s.middle[0], s.ipl[0]];
      const exp = bat ? [c.pressure.xsr, s.vs_spin[1], s.death[1], s.ipl[1]] : [c.pressure.xecon, s.death[1], s.middle[1], s.ipl[1]];
      Plotly.newPlot('vs'+i, [{type:'bar', x:lbl, y:exp, name:'Expected (same situation, same pitch)', marker:{color:GREY}},
        {type:'bar', x:lbl, y:act, name:'Actual', marker:{color:PINK}, cliponaxis:false, text:act.map(v => v==null?'':(bat?Math.round(v):v.toFixed(2))), textposition:'outside'}],
        LAY({barmode:'group', height:300, title:{text: bat ? 'Strike rate under pressure vs expected' : 'Economy under pressure vs expected (lower is better)', font:{size:13}}}), PCFG);
      if (c.dna){ const t = c.dna.top;
        Plotly.newPlot('dna'+i, [{type:'bar', orientation:'h', y:t.map(x => x.name), x:t.map(x => x.base_share), name:'Normal situations', marker:{color:GREY}},
          {type:'bar', orientation:'h', y:t.map(x => x.name), x:t.map(x => x.share), name:'Under pressure', marker:{color:BLUE}}],
          LAY({barmode:'group', height:250, title:{text:`${bat?'Shot':'Delivery'} mix under pressure · drift ${c.dna.drift}`, font:{size:13}}, yaxis:{autorange:'reversed'}, xaxis:{title:'% of balls', gridcolor:'#EEF0F5'}, margin:{l:120,r:14,t:40,b:40}}), PCFG); }

function fitBat(c){ const s = c.splits, o = [];
  if (['Middle order','Finisher'].includes(c.role)) o.push("Plugs RR's biggest leak: Nos. 5–7 under pressure.");
  if (c.role === 'Top order') o.push("No. 3–4 option: RR's top order sits below league average under pressure.");
  if (s.death[2] >= 30 && s.death[0] > s.death[1]) o.push(`Death-overs pressure SR ${s.death[0]} vs ${s.death[1]} expected.`);
  if (s.vs_spin[2] >= 30 && s.vs_spin[0] > s.vs_spin[1]) o.push(`Beats spin under pressure: SR ${s.vs_spin[0]} vs ${s.vs_spin[1]} expected.`);
  if (c.in_rr) o.push('Already an RR player: the case for building around him.');
  if (!c.ipl_seasons) o.push('IPL-untested: pressure record comes from T20Is, so price in the risk of adjusting to IPL conditions.');
  return o.length ? o : ['Pressure-proof top-order option.']; }
function fitBowl(c){ const s = c.splits, o = [];
  if (String(c.phase_role).includes('Death') && s.death[2] >= 30 && s.death[0] < s.death[1]) o.push(`Fixes RR's death-overs leak: pressure economy at the death ${s.death[0]} vs ${s.death[1]} expected.`);
  if (c.kind !== 'Pace' && s.death[2] >= 18 && s.death[0] < s.death[1]) o.push(`A spinner who can bowl at the death (${s.death[0]} vs ${s.death[1]} expected); RR's death spin is −0.32 vs league.`);
  if (c.kind !== 'Pace') o.push("Adds to RR's middle-overs spin, already a strength, to squeeze the chase.");
  if (String(c.phase_role).includes('New ball')) o.push('Can take the new ball too: flexibility in the Impact Player era.');
  if (c.in_rr) o.push('Already an RR player.');
  return o; }
function rr(){

    <div class="warnbox">RR won only <b>${cl.won} of ${cl.n}</b> close IPL games in 2025–26 (decided by ≤15 runs or ≤3 wickets). The leaks: Nos. 5–7 and the tail in run chases, death-overs batting, and death-overs bowling (both pace and spin).</div>
    <h2>How each pick strengthens RR</h2><div class="two"><div>`;
  D.bat_top.forEach(c => h += `<p><b>${c.rank}. ${esc(c.name)}</b> (${esc(c.role)})<br>${fitBat(c).map(x => '• ' + esc(x)).join('<br>')}</p>`);

  D.bowl_top.forEach(c => h += `<p><b>${c.rank}. ${esc(c.name)}</b> (${esc(c.role)})<br>${fitBowl(c).map(x => '• ' + esc(x)).join('<br>')}</p>`);
  h += `</div></div>`;
  setTimeout(() => {
    const tt = RR.team_table.slice().sort((a,b) => a.bat - b.bat);
    Plotly.newPlot('rrT', [{type:'bar', orientation:'h', y:tt.map(t => t.team), x:tt.map(t => t.bat), marker:{color:tt.map(t => t.team==='Rajasthan Royals'?PINK:GREY)}, text:tt.map(t => t.bat.toFixed(2)), textposition:'outside', hovertemplate:'%{y}: %{x:.2f}<extra></extra>'}],
      LAY({height:360, title:{text:'Batting: win % gained per 100 pressure balls', font:{size:13}}, margin:{l:170,r:30,t:40,b:30}}), PCFG);
    const sl = RR.bat_slot;
    Plotly.newPlot('rrS', [{type:'bar', x:sl.map(r => r.role_slot), y:sl.map(r => r.gap), marker:{color:sl.map(r => r.gap<0?PINK:BLUE)}, text:sl.map(r => `${r.gap>0?'+':''}${r.gap} (n=${r.n})`), textposition:'outside', hovertemplate:'%{x}: %{y:.2f}<extra></extra>'}],
      LAY({height:360, title:{text:'RR batting vs league, by slot', font:{size:13}}, yaxis:{range:[-0.9,0.7], gridcolor:'#EEF0F5', title:'Gap, win % / 100 pressure balls'}}), PCFG);
    const ph = RR.bowl_phase_type;
    Plotly.newPlot('rrB', [{type:'bar', x:ph.map(r => r.phase + ' · ' + r.btype), y:ph.map(r => r.gap), marker:{color:ph.map(r => r.gap<0?PINK:BLUE)}, text:ph.map(r => `${r.gap>0?'+':''}${r.gap} (n=${r.n})`), textposition:'outside', hovertemplate:'%{x}: %{y:.2f}<extra></extra>'}],
      LAY({height:320, title:{text:'RR bowling vs league, by phase and type', font:{size:13}}, yaxis:{range:[-0.85,0.5], gridcolor:'#EEF0F5'}}), PCFG);
  });

}

function method(){
  let h = `<div class="method"><h2>1 · Pressure = leverage, not overs</h2>
  <p>A <b>pitch-adjusted win-probability model</b> values every ball. <i>Chase:</i> runs needed vs expected remaining runs for the balls and wickets left on that pitch. <i>Batting first:</i> projected total vs the venue-season par. <b>Leverage</b> for a ball is the expected win-probability swing across everything that could happen (dot, 1, 2, 4, 6, wicket, extra), divided by the innings average so a normal ball scores 1. Pressure index = leverage × 1.2 after three or more dots in a row × 1.2 if a wicket fell in the last six balls. <b>The top 20% of balls are pressure balls.</b> Close finishes contain 84% more of them than other games, and 43% of death-over balls carry below-average leverage (usually dead games).</p>
  <h2>2 · Flat-wicket correction</h2><p>Every expectation uses the match's <b>scoring environment</b>: a shrunk venue effect plus the competition-season run rate. IPL rose from 8.6 to 9.8 runs per over in 2022–26, so 40 off 25 in 2026 is worth less than in 2022, and a bowler going at 8.5 in 2026 is having a good day.</p>
  <h2>3 · The rating (PRR)</h2><p>For each process skill (runs, dismissals and dots for batters; runs, wickets and dots for bowlers) we measure <b>actual minus expected</b> on every ball, where expected means the same innings, ball, wickets, required rate, pace or spin, and pitch. Pressure estimate = the player's (shrunk) all-situation skill + his pressure difference × n/(n+200). Then add <b>moments won</b> and <b>rise vs own baseline</b>. Opponents are weighted (associates 0.5, Ireland/Zimbabwe 0.8, A-teams 0.75), as is recency (0.55 in 2022 → 1.0 in 2026); knockouts count × 1.25.</p>
  <div class="tbl" style="max-height:none"><table><tr><th>Component</th><th>Batting weight</th><th>Bowling weight</th></tr>
  <tr><td>Runs vs expected</td><td>30%</td><td>25%</td></tr><tr><td>Dismissals / wickets</td><td>20%</td><td>20%</td></tr><tr><td>Dots</td><td>25%</td><td>30%</td></tr><tr><td>Moments won</td><td>15%</td><td>15%</td></tr><tr><td>Rise vs own baseline</td><td>10%</td><td>10%</td></tr></table></div>
  <div class="two" style="margin-top:12px"><div id="env" class="plot"></div><div id="rel" class="plot"></div></div>
  <h2>4 · Honest limits</h2><ul>
  <li>Pressure performance is <b>noisy</b>: even the best score repeats at about 0.3. Every rank carries an 80% band from 300 match-level bootstrap resamples.</li>
  <li>First-innings win probability is less certain (AUC 0.70 vs 0.90 for chases) because the target is unknown.</li>
  <li>No line, length, shot direction or edge data, so "decision vs execution" is built from stroke and delivery labels only.</li>
  <li>Pakistani players are rated but left off the board because they are not available at the IPL auction.</li>
  <li>DLS-shortened and no-result games are excluded; super overs are not scored.</li></ul></div>`;
  setTimeout(() => {
    const env = D.env;
    Plotly.newPlot('env', [true, false].map(ipl => { const e = env.filter(r => r.ipl === ipl);
      return {x:e.map(r => r.yr), y:e.map(r => r.actual), mode:'lines+markers+text', text:e.map(r => r.actual.toFixed(2)), textposition:'top center', name: ipl ? 'IPL' : 'T20I', line:{color: ipl ? PINK : BLUE, width:2}}; }),
      LAY({height:320, title:{text:'Flat-wicket factor: runs per over by season', font:{size:13}}, yaxis:{range:[7.8,10.4], title:'Runs per over', gridcolor:'#EEF0F5'}, xaxis:{dtick:1, gridcolor:'#EEF0F5'}}), PCFG);
    const cats = ['Batting · odd/even', 'Batting · 22–24→25–26', 'Bowling · odd/even', 'Bowling · 22–24→25–26'];
    const nv = [V.bat.split_half_naive, V.bat.temporal_naive, V.bowl.split_half_naive, V.bowl.temporal_naive], pv = [V.bat.split_half_prr, V.bat.temporal_prr, V.bowl.split_half_prr, V.bowl.temporal_prr];
    Plotly.newPlot('rel', [{type:'bar', x:cats, y:nv, name:'Naive clutch score', marker:{color:GREY}, text:nv.map(v => v.toFixed(2)), textposition:'outside'},
      {type:'bar', x:cats, y:pv, name:'PRR', marker:{color:PINK}, text:pv.map(v => v.toFixed(2)), textposition:'outside'}],
      LAY({barmode:'group', height:320, title:{text:'Does the score repeat? (correlation)', font:{size:13}}, yaxis:{range:[-0.05,0.42], gridcolor:'#EEF0F5'}}), PCFG);
  });
  return h;
}

function board(){
  const rows = st.tDisc==='bat' ? D.bat_table : D.bowl_table;
  const roles = ['All', ...Array.from(new Set(rows.map(r => r.role))).sort()];
  let t = rows.filter(r => (st.tRole==='All' || r.role===st.tRole) && (st.tNat==='All' || (st.tNat==='Indian' ? r.nat==='India' : r.nat!=='India')) && (!st.tQ || r.name.toLowerCase().includes(st.tQ.toLowerCase())));
  const bat = st.tDisc==='bat';
  let h = `<div class="ctrl">${seg('tDisc', st.tDisc)}<select id="tRole">${roles.map(r => `<option ${r===st.tRole?'selected':''}>${esc(r)}</option>`).join('')}</select>
    <select id="tNat">${['All','Indian','Overseas'].map(r => `<option ${r===st.tNat?'selected':''}>${r}</option>`).join('')}</select><input id="tQ" placeholder="Search name" value="${esc(st.tQ)}"></div>
    <div class="tbl"><table><tr><th>Rank</th><th>Player</th><th>Role</th><th>Nation</th><th>IPL 2026</th><th>PRR</th><th>80% band</th><th>P(top 10)</th><th>Pressure balls</th>
    ${bat ? '<th>SR (exp)</th><th>Dot% (exp)</th><th>Avg</th>' : '<th>Econ (exp)</th><th>Dot% (exp)</th><th>Balls/wkt</th>'}<th>On board</th></tr>`;
  t.forEach(r => { h += `<tr><td>${r.rank}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.role)}</td><td>${esc(r.nat)}</td><td>${esc(r.ipl_team)}</td><td>${f1(r.prr)}</td><td>${r.lo}–${r.hi}</td><td>${Math.round(r.p10)}%</td><td>${r.balls}</td>
    ${bat ? `<td>${f1(r.sr)} (${f1(r.xsr)})</td><td>${f1(r.dot)} (${f1(r.xdot)})</td><td>${f1(r.avg)}</td>` : `<td>${r.econ} (${r.xecon})</td><td>${f1(r.dot)} (${f1(r.xdot)})</td><td>${f1(r.bpw)}</td>`}<td>${r.selected ? '✓' : ''}</td></tr>`; });
  h += `</table></div><div class="muted" style="margin-top:6px">${t.length} players. Figures are on pressure balls; "exp" is what the same situations on the same pitches normally produce.</div>`;
  setTimeout(() => {
    document.getElementById('tRole').onchange = e => { st.tRole = e.target.value; render(); };
    document.getElementById('tNat').onchange = e => { st.tNat = e.target.value; render(); };
    const q = document.getElementById('tQ'); q.oninput = e => { st.tQ = e.target.value; render(); const n = document.getElementById('tQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  });
  return h;
}

function render(){
  renderTabs();
  const fn = {war, moments, lab, rr, method, board}[cur];
  document.getElementById('view').innerHTML = fn();
  armReveals();
  document.querySelectorAll('[data-seg]').forEach(b => b.onclick = () => {
    const k = b.dataset.seg; st[k] = b.dataset.v;
    if (k==='mDisc') st.mPick = null; if (k==='lDisc') { st.l1 = null; st.l2 = ''; } if (k==='tDisc') st.tRole = 'All';
    render(); });
}
try { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) cur = h; } catch(e) {}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h) && h !== cur) { cur = h; render(); } });
render();
</script>
</body>
</html>
